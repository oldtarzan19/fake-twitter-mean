map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/m;

server {
  listen 80;
  server_name app.test localhost 127.0.0.1;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name app.test localhost 127.0.0.1;

  ssl_certificate /etc/nginx/certs/app.test.pem;
  ssl_certificate_key /etc/nginx/certs/app.test-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;

  location = /debug_ip {
    default_type text/plain;
    return 200 "$remote_addr\n";
  }

  location /api/ {
    limit_req zone=api_rl burst=15 nodelay;
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_cache_bypass $http_upgrade;
  }

  location / {
    proxy_pass http://frontend/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
